#     x86_64-ps16k-36_r07.zip, sha1 dd783282e84bf475a02eba6777c79fc5695e1583)
#     under the pinned emulator 37.2.13 (sha1 f41f9e31eb5ca64926603c03265c50b…).
#     Fail-closed asserts: kernel `getconf PAGESIZE` == 16384; on-device
#     sha256 == artifact sha256 (transfer integrity, 5 files); on-device
