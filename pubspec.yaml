name: aethone
description: >-
  AETHONE — cross-platform VPN client. Flutter UI layer; network engines are
  Aether (Rust, WARP client) and zeptun (Zig, userspace TUN router).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # SVG rendering for the ZIP-provided asset set (mandatory: the owner requires
  # the exact SVGs from the design package — no generic icon packs).
  flutter_svg: 2.3.2
  # ---- M2 (engine wiring) ----
  # Native allocations for the Aether C API (malloc/Utf8 helpers). Pure
  # Dart; pinned to the version already vendored in the toolchain cache.
  ffi: 2.2.0
  # Telegram channel link (t.me/AETHONE) — owner-specified behavior of the
  # top-bar info button (decision D1, option A).
  url_launcher: 6.3.3
  # ---- v4.19 (#8 settings persistence) ----
  # The user's settings must survive app restarts (owner device test: «اپ
  # انتخاب های تنظیمات رو یادش نمیمونه»). Storage: Android
  # SharedPreferences via the first-party plugin.
  shared_preferences: 2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Fonts: IRANYekanX committed under design/fonts (11 weights exist; 6 wired
  # per design-token report table 2 — pending decision D12 for the rest).
  # LICENSE WARNING (report §2.2 / D10): IRANYekanX is a commercial Fontiran
  # family; confirm the license before any public release build.
  fonts:
    - family: IRANYekanX
      fonts:
        - asset: design/fonts/IRANYekanX-Light.ttf
          weight: 300
        - asset: design/fonts/IRANYekanX-Regular.ttf
          weight: 400
        - asset: design/fonts/IRANYekanX-Medium.ttf
          weight: 500
        - asset: design/fonts/IRANYekanX-DemiBold.ttf
          weight: 600
        - asset: design/fonts/IRANYekanX-Bold.ttf
          weight: 700
        - asset: design/fonts/IRANYekanX-ExtraBold.ttf
          weight: 800

  assets:
    # --- reference screens are NOT bundled as app assets (documentation only) ---
    # --- app logo (design/آیکون اپ) ---
    - design/آیکون اپ/1.svg
    - design/آیکون اپ/2.svg
    - design/آیکون اپ/3.svg
    # --- protocol logos (design/آیکون پروتکل ها) — Tor/Psiphon are
    # pre-rendered PNGs (v4.10: their SVGs embed hidden tracing rasters that
    # flutter_svg renders partially); the original SVGs stay committed as the
    # design source of truth ---
    - design/آیکون پروتکل ها/ماسک.svg
    - design/آیکون پروتکل ها/میم.svg
    - design/آیکون پروتکل ها/وایرگارد.svg
    - design/آیکون پروتکل ها/گول.svg
    - design/آیکون پروتکل ها/گول کلاسیک.svg
    - design/proto_icons_png/
    # --- background patterns: pre-rendered PNGs (v4.10 — the SVGs carry
    # feGaussianBlur which flutter_svg cannot rasterize; rendered via
    # headless Chromium with filters intact; SVG sources stay committed) ---
    - design/patterns_png/
    # --- country flags: pre-rendered 256×256 PNGs (v4.10 — 265 of 266 SVGs
    # embed the artwork as raster <image> inside <pattern>, unsupported by
    # flutter_svg; PNGs are extracted from the owner's own embedded artwork.
    # The original SVG directory stays committed as the design source.) ---
    - design/flags_png/
    # --- linear icon set: only the icons the UI actually uses ---
    - design/آیکون های اپ/Shield Tick.svg
    - design/آیکون های اپ/Shield Cross.svg
    - design/آیکون های اپ/Graph Down.svg
    - design/آیکون های اپ/Graph Up.svg
    - design/آیکون های اپ/Download.svg
    - design/آیکون های اپ/Upload.svg
    - design/آیکون های اپ/Setting.svg
    - design/آیکون های اپ/Information Circle.svg
    - design/آیکون های اپ/Map.svg
    - design/آیکون های اپ/Send 1.svg
    # --- v4.11 (owner defect reports #2/#4/#12): the connect button icon,
    # the speed-test icon and the protocol-card chevron are the set's own
    # Off.svg / Activity 4.svg / Right 2.svg ---
    - design/آیکون های اپ/Off.svg
    - design/آیکون های اپ/Activity 4.svg
    - design/آیکون های اپ/Right 2.svg
    # --- step 2 (settings main page): the set's own line icons for the six
    # cards + status cards + section headings, plus the owner's GitHub logo
    # for the server cards (all pixel-matched against the design frame) ---
    - design/آیکون های اپ/Redo.svg
    - design/آیکون های اپ/Filter 5.svg
    - design/آیکون های اپ/Lock 1.svg
    - design/آیکون های اپ/Website.svg
    - design/آیکون های اپ/Palette.svg
    - design/آیکون های اپ/Shield Star.svg
    - design/آیکون های اپ/Scan 1.svg
    - design/آیکون های اپ/Menu Hamburger.svg
    - design/صفحه تنظیمات/لوگو گیت هاب.svg
    # --- v4.15 (owner settings round #1/#7/#8): the owner named the REAL
    # set icons for the settings page — Security Safe.svg (security card),
    # Menu Fries.svg (وضعیت پیکربندی heading), Situation 1.svg (آدرس هسته
    # ها heading). Send 1.svg is already declared above (line icon set). ---
    - design/آیکون های اپ/Security Safe.svg
    - design/آیکون های اپ/Menu Fries.svg
    - design/آیکون های اپ/Situation 1.svg
    # v4.16 protocol sheet: the «حالت اتصال»/«سرعت اسکن» heading badge
    # (Password 1.svg — the key-in-frame glyph measured on the sheet frame).
    # v4.17 — the «پروتکل» badge + the settings protocol status card carry
    # Swap 1.svg (owner: «آیکون پروتکل باید Swap 1.svg»).
    - design/آیکون های اپ/Password 1.svg
    - design/آیکون های اپ/Swap 1.svg
    # v4.16 descriptions popup: the × close glyph.
    - design/آیکون های اپ/Close.svg
