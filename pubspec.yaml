name: aethone
description: >-
  AETHONE — cross-platform VPN client. Flutter UI layer; network engines are
  Aether (Rust, WARP client) and zeptun (Zig, userspace TUN router).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # SVG rendering for the ZIP-provided asset set (mandatory: the owner requires
  # the exact SVGs from the design package — no generic icon packs).
  flutter_svg: 2.3.2
  # ---- M2 (engine wiring) ----
  # Native allocations for the Aether C API (malloc/Utf8 helpers). Pure
  # Dart; pinned to the version already vendored in the toolchain cache.
  ffi: 2.2.0
  # Telegram channel link (t.me/AETHONE) — owner-specified behavior of the
  # top-bar info button (decision D1, option A).
  url_launcher: 6.3.3
  # ---- v4.19 (#8 settings persistence) ----
  # The user's settings must survive app restarts (owner device test: «اپ
  # انتخاب های تنظیمات رو یادش نمیمونه»). Storage: Android
  # SharedPreferences via the first-party plugin.
  shared_preferences: 2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Fonts: IRANYekanX committed under design/fonts (11 weights exist; 6 wired
  # per design-token report table 2 — pending decision D12 for the rest).
  # LICENSE WARNING (report §2.2 / D10): IRANYekanX is a commercial Fontiran
  # family; confirm the license before any public release build.
  fonts:
    - family: IRANYekanX
      fonts:
        - asset: design/fonts/IRANYekanX-Light.ttf
          weight: 300
        - asset: design/fonts/IRANYekanX-Regular.ttf
          weight: 400
        - asset: design/fonts/IRANYekanX-Medium.ttf
          weight: 500
        - asset: design/fonts/IRANYekanX-DemiBold.ttf
          weight: 600
        - asset: design/fonts/IRANYekanX-Bold.ttf
          weight: 700
        - asset: design/fonts/IRANYekanX-ExtraBold.ttf
          weight: 800

  assets:
    # --- reference screens are NOT bundled as app assets (documentation only) ---
    # --- app logo (design/آیکون اپ) ---
    - design/آیکون اپ/1.svg
    - design/آیکون اپ/2.svg
    - design/آیکون اپ/3.svg
    # v4.35 — the owner's round-11 green mark behind the wordmark (item 3).
    - design/آیکون اپ/آیکون بالای اپ.svg
    # --- protocol logos (design/آیکون پروتکل ها). v4.40 (owner round 16):
    # the owner's own icon FILES, verbatim — «رنگ و شکل آیکون ها باید
    # دقیقا همین فایل هایی باشه که برات ارسال شده». Dark/light PAIRS
    # (ماسک/میم/وایرگارد/گول — the owner's «دارک»/«لایت" file names);
    # ONE face for both themes (تور/سایفون/گول کلاسیک — «هر دو حالت")
    # and the four combined-mode logos. The old single-face files stay
    # committed as the design record but ship no longer. ---
    - design/آیکون پروتکل ها/ماسک دارک.svg
    - design/آیکون پروتکل ها/ماسک لایت.svg
    - design/آیکون پروتکل ها/میم دارک.svg
    - design/آیکون پروتکل ها/میم لایت.svg
    - design/آیکون پروتکل ها/وایرگارد دارک.svg
    - design/آیکون پروتکل ها/وایرگارد لایت.svg
    - design/آیکون پروتکل ها/گول دارک.svg
    - design/آیکون پروتکل ها/گول لایت.svg
    - design/آیکون پروتکل ها/گول کلاسیک هردو حالت.svg
    - design/آیکون پروتکل ها/تور هر دو حالت.svg
    - design/آیکون پروتکل ها/سایفون هر دو حالت.svg
    # --- v4.33 (owner round 9): the combined-mode icons — the owner's own
    #     SVGs (سایفون اور وارپ / وارپ اور سایفون / تور اور وارپ / وارپ اور
    #     تور) replace the composed aether+chevron stacks on the sub-tiles;
    #     committed under their owner-given names (never rename). ---
    - design/آیکون پروتکل ها/سایفون اور وارپ.svg
    - design/آیکون پروتکل ها/وارپ اور سایفون.svg
    - design/آیکون پروتکل ها/تور اور وارپ.svg
    - design/آیکون پروتکل ها/وارپ اور تور.svg
    # --- background patterns: pre-rendered PNGs (v4.10 — the SVGs carry
    # feGaussianBlur which flutter_svg cannot rasterize; rendered via
    # headless Chromium with filters intact; SVG sources stay committed) ---
    - design/patterns_png/
    # --- v4.41 (round 17): the country routing profiles — one [direct]
    #     rule file per routing-area pick (ccTLD suffixes + domestic
    #     domains + the country's aggregated IPv4 space); the adapter
    #     plants the selected one as AETHER_ROUTES_FILE at every connect. ---
    - design/routing/
    # --- country flags: pre-rendered 256×256 PNGs (v4.10 — 265 of 266 SVGs
    # embed the artwork as raster <image> inside <pattern>, unsupported by
    # flutter_svg; PNGs are extracted from the owner's own embedded artwork.
    # The original SVG directory stays committed as the design source.) ---
    - design/flags_png/
    # --- linear icon set: only the icons the UI actually uses ---
    - design/آیکون های اپ/Shield Tick.svg
    - design/آیکون های اپ/Shield Cross.svg
    - design/آیکون های اپ/Graph Down.svg
    - design/آیکون های اپ/Graph Up.svg
    - design/آیکون های اپ/Download.svg
    - design/آیکون های اپ/Upload.svg
    - design/آیکون های اپ/Setting.svg
    - design/آیکون های اپ/Category.svg
    - design/آیکون های اپ/Tick.svg
    - design/آیکون های اپ/Notification 1.svg
    - design/آیکون های اپ/Information Circle.svg
    - design/آیکون های اپ/Map.svg
    - design/آیکون های اپ/Send 1.svg
    # v1.0.0 (round 18) — the About-card link rows: Send 3 (Telegram) +
    # Instagram (the owner-named glyphs).
    - design/آیکون های اپ/Send 3.svg
    - design/آیکون های اپ/Instagram.svg
    # --- v4.11 (owner defect reports #2/#4/#12): the connect button icon,
    # the speed-test icon and the protocol-card chevron are the set's own
    # Off.svg / Activity 4.svg / Right 2.svg ---
    - design/آیکون های اپ/Off.svg
    - design/آیکون های اپ/Activity 4.svg
    - design/آیکون های اپ/Right 2.svg
    # --- v4.24 speed test («صفحه تست سرعت»): the stat-card glyphs —
    # the set's own Wifi.svg (ping); the jitter drop-with-rain and the
    # badge/button hexagon+wave brand glyph are traced from the committed
    # design frames (design/speed_glyphs — the patterns_png precedent). ---
    - design/آیکون های اپ/Wifi.svg
    - design/speed_glyphs/Drop Rain.svg
    - design/speed_glyphs/Hex Wave.svg
    # --- v4.33 (owner round 9): the dial NEEDLE — the owner's own SVG
    #     (عقربه, 15×52, green→transparent gradient), pivoted at the dial
    #     centre and sweeping with the measured download speed. ---
    - design/speed_glyphs/عقربه صفحه تست سرعت.svg
    # --- step 2 (settings main page): the set's own line icons for the six
    # cards + status cards + section headings, plus the owner's GitHub logo
    # for the server cards (all pixel-matched against the design frame) ---
    - design/آیکون های اپ/Redo.svg
    - design/آیکون های اپ/Filter 5.svg
    - design/آیکون های اپ/Lock 1.svg
    - design/آیکون های اپ/Website.svg
    - design/آیکون های اپ/Palette.svg
    - design/آیکون های اپ/Shield Star.svg
    - design/آیکون های اپ/Scan 1.svg
    - design/آیکون های اپ/Menu Hamburger.svg
    - design/صفحه تنظیمات/لوگو گیت هاب.svg
    # --- v4.15 (owner settings round #1/#7/#8): the owner named the REAL
    # set icons for the settings page — Security Safe.svg (security card),
    # Menu Fries.svg (وضعیت پیکربندی heading), Situation 1.svg (آدرس هسته
    # ها heading). Send 1.svg is already declared above (line icon set). ---
    - design/آیکون های اپ/Security Safe.svg
    - design/آیکون های اپ/Menu Fries.svg
    - design/آیکون های اپ/Situation 1.svg
    # v4.16 protocol sheet: the «حالت اتصال»/«سرعت اسکن» heading badge
    # (Password 1.svg — the key-in-frame glyph measured on the sheet frame).
    # v4.17 — the «پروتکل» badge + the settings protocol status card carry
    # Swap 1.svg (owner: «آیکون پروتکل باید Swap 1.svg»).
    - design/آیکون های اپ/Password 1.svg
    - design/آیکون های اپ/Swap 1.svg
    # v4.16 descriptions popup: the × close glyph.
    - design/آیکون های اپ/Close.svg
    # v4.22 (settings sub-pages): every glyph the sub-pages use — the
    # owner-swappable icon table lives in lib/core/app_assets.dart.
    - design/آیکون های اپ/Crop 1.svg
    - design/آیکون های اپ/Arrow Swap Horizontal.svg
    - design/آیکون های اپ/Down 1.svg
    - design/آیکون های اپ/Up 1.svg
    - design/آیکون های اپ/Watch 1.svg
    - design/آیکون های اپ/Location.svg
    - design/آیکون های اپ/Discovery 1.svg
    - design/آیکون های اپ/Shuffle 1.svg
    - design/آیکون های اپ/Add.svg
    - design/آیکون های اپ/Minus.svg
    - design/آیکون های اپ/Left 2.svg
    - design/آیکون های اپ/Home 1.svg
    # v4.23 (onboarding «صفحه شروع»): the wizard's own glyphs — the check
    # badge, the two gray-tile glyphs and the two option-card shields (the
    # full owner-swappable table lives in lib/core/app_assets.dart).
    - design/آیکون های اپ/Tick Circle.svg
    - design/آیکون های اپ/Close Circle.svg
    - design/آیکون های اپ/Shield 1.svg
    - design/آیکون های اپ/Shield Star.svg
    # --- v4.34 light mode (owner round 10): the theme-toggle pair
    # («آیکون با نام Sun 1 برای حالت لایت و آیکون با نام Moon برای حالت
    # نایت مود که هردو در پوشه آیکون های اپ موجود هستند»). ---
    - design/آیکون های اپ/Sun 1.svg
    - design/آیکون های اپ/Moon.svg
